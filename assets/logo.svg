<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%">
  <defs>
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- 100% Transparent, No Box -->
  <g transform="translate(30, 20)">
    <!-- Aerodynamic Radio Wave Accent -->
    <path d="M 10 95 Q 60 20 120 95" fill="none" stroke="url(#airGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 30 95 Q 60 45 90 95" fill="none" stroke="url(#airGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <!-- AIR Modern Tech Wordmark -->
    <text x="130" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="4" fill="url(#airGrad)">AIR</text>
    <!-- BOT Cyberpunk Contrast -->
    <text x="320" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="8" fill="url(#botGrad)">BOT</text>
    <!-- Live Airwave Signal Nodes -->
    <circle cx="515" cy="40" r="7" fill="#00f0ff"/>
    <circle cx="530" cy="30" r="5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="542" cy="22" r="3" fill="#818cf8" opacity="0.4"/>
  </g>
</svg>
