<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    
    <!-- Neon Cyan & Violet Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="metalVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="4"/>

  <!-- Radar Concentric Background Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0e3a5a" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0e3a5a" stroke-width="1.5" opacity="0.4"/>
  <circle cx="256" cy="256" r="80"  fill="none" stroke="#0e3a5a" stroke-width="1" opacity="0.3"/>

  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>

  <!-- AIR: Radio Broadcast Waves (Left & Right Wings) -->
  <!-- Left Waves -->
  <path d="M 120 180 A 110 110 0 0 0 120 332" fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>
  <path d="M 85 140 A 160 160 0 0 0 85 372" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  <path d="M 50 100 A 210 210 0 0 0 50 412" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" opacity="0.15"/>

  <!-- Right Waves -->
  <path d="M 392 180 A 110 110 0 0 1 392 332" fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>
  <path d="M 427 140 A 160 160 0 0 1 427 372" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  <path d="M 462 100 A 210 210 0 0 1 462 412" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" opacity="0.15"/>

  <!-- BOT: Central Cybernetic Robot Head -->
  <g transform="translate(0, 10)">
    <!-- Antenna Tower Mast -->
    <path d="M 256 95 L 256 160" stroke="url(#neonCyan)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="256" cy="85" r="10" fill="#00f5ff" filter="url(#glow)"/>
    <circle cx="256" cy="85" r="4" fill="#ffffff"/>

    <!-- Angular Outer Helmet/Chassis -->
    <path d="M 170 170 
             L 342 170 
             L 370 240 
             L 330 350 
             L 256 385 
             L 182 350 
             L 142 240 Z" 
          fill="#0c1524" 
          stroke="url(#neonPurple)" 
          stroke-width="5" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Forehead Armor Plates -->
    <polygon points="210,185 302,185 320,220 192,220" fill="#132238" stroke="#1e3a5f" stroke-width="2"/>
    
    <!-- Neon Cyan Visor (The Eye of AirBot) -->
    <polygon points="175,235 337,235 320,285 192,285" 
             fill="url(#metalVisor)" 
             filter="url(#glow)"/>
    
    <!-- High-Tech Visor Core Scanlines -->
    <line x1="182" y1="260" x2="330" y2="260" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <line x1="195" y1="248" x2="317" y2="248" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="198" y1="272" x2="314" y2="272" stroke="#003d66" stroke-width="1.5"/>

    <!-- Jaw & Audio Grille -->
    <polygon points="215,310 297,310 285,345 227,345" fill="#111c2e" stroke="#0284c7" stroke-width="2"/>
    <line x1="235" y1="322" x2="277" y2="322" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="240" y1="332" x2="272" y2="332" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Ear Telemetry Nodes -->
    <rect x="135" y="235" width="12" height="35" rx="3" fill="#38bdf8" filter="url(#glow)"/>
    <rect x="365" y="235" width="12" height="35" rx="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Typography Label: AIR BOT -->
  <text x="256" y="445" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#ffffff">
    AIR <tspan fill="#00f5ff">BOT</tspan>
  </text>
  <text x="256" y="475" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="#64748b">
    TELECOM SENTINEL
  </text>
</svg>
