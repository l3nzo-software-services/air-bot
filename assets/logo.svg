<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <defs>
    <!-- Master Neon Cyan to Cyber Sky Gradient -->
    <linearGradient id="airBotScriptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="85%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Wi-Fi Antenna Glowing Gradient -->
    <linearGradient id="wifiAirGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Holographic Neon Glow -->
    <filter id="handwriteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Dancing+Script:wght@700&amp;display=swap');
      .cursive-title {
        font-family: 'Dancing Script', 'Caveat', 'Segoe Script', cursive, sans-serif;
        font-size: 155px;
        font-weight: 700;
        fill: url(#airBotScriptGrad);
        filter: url(#handwriteGlow);
      }
      .flourish-under {
        fill: none;
        stroke: url(#airBotScriptGrad);
        stroke-linecap: round;
        filter: url(#handwriteGlow);
      }
      .wifi-wave {
        fill: none;
        stroke: url(#wifiAirGrad);
        stroke-linecap: round;
        filter: url(#handwriteGlow);
      }
    </style>
  </defs>

  <!-- Flowing Signature Underline Flourish -->
  <path class="flourish-under" stroke-width="7" opacity="0.9"
        d="M 45 185 C 160 215, 380 220, 560 188 C 600 180, 625 168, 640 152" />

  <!-- Smooth Connected Cursive Calligraphy "Air Bot" -->
  <g class="flourish-under" stroke-width="14">
    <!-- Capital 'A' Signature Swash & Loop -->
    <path d="M 55 168 C 95 55, 128 42, 148 90 C 162 128, 142 168, 105 168 C 76 168, 72 136, 98 116 C 132 94, 168 108, 190 162" />

    <!-- 'i' Connected Upward Glide -->
    <path d="M 190 162 C 202 138, 214 114, 226 110 C 232 108, 236 116, 236 136 C 236 156, 246 166, 262 160" />
    <circle cx="226" cy="78" r="8" fill="#00f0ff" stroke="none" filter="url(#handwriteGlow)"/>

    <!-- 'r' Calligraphic Cursive Shoulder -->
    <path d="M 262 160 C 272 135, 282 112, 294 114 C 304 116, 318 112, 316 130 C 312 150, 332 166, 360 152" />

    <!-- 'B' Signature Master Dual Loop -->
    <path d="M 405 60 C 400 115, 388 165, 388 178" />
    <path d="M 390 65 C 425 48, 465 58, 460 95 C 455 120, 420 125, 398 125 C 435 125, 475 135, 470 165 C 465 190, 420 188, 398 182 C 420 182, 450 182, 482 165" />

    <!-- 'o' Seamless Connecting Loop -->
    <path d="M 482 165 C 494 135, 508 112, 530 112 C 554 112, 560 135, 554 155 C 548 175, 526 175, 516 160 C 506 138, 526 122, 546 122 L 574 122" />

    <!-- 't' Stem with Sharp Crossbar & Upward Flourish -->
    <path d="M 574 122 C 586 112, 598 85, 602 60 L 602 155 C 602 175, 618 178, 638 165" />
    <path d="M 578 102 Q 616 98, 638 102" stroke-width="11" />
  </g>

  <!-- Precise Cursive Fallback for Universal SVG Renderers (GitHub dark/light) -->
  <text x="50" y="165" class="cursive-title" opacity="0.25">Air Bot</text>

  <!-- ================================================================== -->
  <!-- 📶 TOP-RIGHT CORNER: RADIATING WI-FI AIRWAVE SENTINEL SYMBOL -->
  <!-- ================================================================== -->
  <g transform="translate(610, 22)">
    <!-- Base Core Dot -->
    <circle cx="50" cy="80" r="7.5" fill="#00f0ff" filter="url(#handwriteGlow)"/>

    <!-- Wi-Fi Wave 1 (Inner Arc) -->
    <path class="wifi-wave" stroke-width="6.5"
          d="M 35 64 A 20 20 0 0 1 65 64" />

    <!-- Wi-Fi Wave 2 (Middle Arc) -->
    <path class="wifi-wave" stroke-width="5.5" opacity="0.9"
          d="M 23 48 A 36 36 0 0 1 77 48" />

    <!-- Wi-Fi Wave 3 (Outer Radiance Arc) -->
    <path class="wifi-wave" stroke-width="5" opacity="0.75"
          d="M 10 32 A 52 52 0 0 1 90 32" />
  </g>
</svg>
