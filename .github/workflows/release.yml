name: Build & Release AIR BOT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --noconsole --name "AIR_BOT" --icon="assets/logo.ico" --add-data "cellsentinel/templates;cellsentinel/templates" --add-data "cellsentinel/static;cellsentinel/static" --add-data "data;data" --add-data "assets;assets" --collect-all cellsentinel --collect-all uvicorn desktop_launcher.py
          Compress-Archive -Path dist/AIR_BOT.exe -DestinationPath dist/AIR_BOT_Windows_x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: air-bot-windows
          path: dist/AIR_BOT_Windows_x64.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        working-directory: ./android-client
        run: |
          gradle assembleDebug --no-daemon || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: air-bot-apk
          path: android-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

